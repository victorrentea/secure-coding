spring.application.name=mtls-b
server.port=8443

# --- Single JKS holds BOTH B's private key AND A's trusted public cert ---
server.ssl.enabled=true
server.ssl.key-store=classpath:b.jks
server.ssl.key-store-type=JKS
server.ssl.key-store-password=changeit
server.ssl.key-alias=b
server.ssl.key-password=changeit

# mTLS: require client cert; same JKS used as truststore
server.ssl.client-auth=need
server.ssl.trust-store=classpath:b.jks
server.ssl.trust-store-type=JKS
server.ssl.trust-store-password=changeit

logging.level.org.apache.tomcat.util.net=INFO
